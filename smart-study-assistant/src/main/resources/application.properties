server.port=8080
spring.servlet.multipart.max-file-size=10MB
spring.servlet.multipart.max-request-size=10MB

# Ollama

spring.application.name=smart-study-assistant




spring.ai.ollama.base-url=http://localhost:11434
spring.ai.ollama.chat.options.model=llama3.2
spring.ai.ollama.chat.options.temperature=0.2
spring.ai.ollama.embedding.options.model=nomic-embed-text
# Download models automatically if missing (first start can take a few minutes)
spring.ai.ollama.init.pull-model-strategy=when_missing
spring.ai.ollama.init.chat.include=true
spring.ai.ollama.init.embedding.include=true
spring.ai.ollama.init.timeout=15m

# Where the vector store and document list are persisted
study.data-dir=./data
